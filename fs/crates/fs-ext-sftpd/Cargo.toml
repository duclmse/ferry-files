[package]
name    = "fs-ext-sftpd"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fs-ext-sftpd"
path = "src/main.rs"

[dependencies]
tokio              = { workspace = true }
tokio-util         = { workspace = true }
serde              = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
anyhow             = { workspace = true }
common             = { path = "../common" }
# Same backend choice as rar2zip: ring avoids aws-lc-rs, which needs NASM on Windows.
russh      = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"
# Host key generation; the version russh's ssh-key uses.
rand       = "0.10"
sha2       = "0.10"
hex        = "0.4"

[dev-dependencies]
tempfile = "3"
