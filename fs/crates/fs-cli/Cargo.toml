[package]
name    = "fs-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fs"
path = "src/main.rs"

[dependencies]
fs-protocol = { path = "../fs-protocol" }
tokio       = { workspace = true }
serde       = { workspace = true }
serde_json  = { workspace = true }
toml        = { workspace = true }
anyhow      = { workspace = true }
clap        = { workspace = true }

# TUI
ratatui   = { version = "0.30", default-features = false, features = ["crossterm_0_29", "all-widgets", "layout-cache", "macros", "underline-color"] }
crossterm = "0.29"
