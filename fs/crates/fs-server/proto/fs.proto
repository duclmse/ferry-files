syntax = "proto3";
package fs;

service FileSearch {
  rpc Search       (SearchRequest)  returns (SearchResponse);
  rpc SearchStream (SearchRequest)  returns (stream SearchResult);
  rpc GetStats     (StatsRequest)   returns (StatsResponse);
  rpc Reindex      (ReindexRequest) returns (ReindexResponse);
  rpc ListWatchPaths  (ListWatchPathsRequest) returns (WatchPathsResponse);
  // Add and remove need the bearer token whatever api.auth_mode is.
  rpc AddWatchPath    (WatchPathRequest)      returns (WatchPathsResponse);
  rpc RemoveWatchPath (WatchPathRequest)      returns (WatchPathsResponse);
  // What changes, as it happens, until the client cancels.
  rpc Subscribe       (SubscribeRequest)      returns (stream Notice);
  // The config file, read and changed while the daemon runs, which reads
  // the file only at startup. Both need the bearer token whatever
  // api.auth_mode is: the config may hold passwords.
  rpc GetConfig       (GetConfigRequest)      returns (ConfigValue);
  rpc ChangeConfig    (ChangeConfigRequest)   returns (ConfigApplied);
}

message SearchRequest {
  string query  = 1;
  int32  limit  = 2;
  int32  offset = 3;
}

message SearchResult {
  string path          = 1;
  string name          = 2;
  string extension     = 3;
  int64  size_bytes    = 4;
  int64  mtime         = 5;
  float  score         = 6;
  string snippet       = 7;
  bool   is_dir        = 8;
  string archive_path  = 10;
  string archive_entry = 11;
}

message SearchResponse {
  repeated SearchResult results = 1;
  int32 total   = 2;
  int64 took_ms = 3;
}

message StatsRequest {}

message StatsResponse {
  int64  total_files             = 4;
  int64  total_dirs              = 5;
  int64  content_indexed         = 6;
  int64  last_crawl_secs         = 7;
  int64  events_processed        = 8;
  string index_size_human        = 9;
  int64  archive_entries_indexed = 10;
  int64  archives_crawled        = 11;
}

message ReindexRequest  { bool full = 1; }
message ReindexResponse { bool accepted = 1; }

message ListWatchPathsRequest {}
message WatchPathRequest {
  string path = 1;
  // RemoveWatchPath: remove the path's entries from the index too.
  bool forget = 2;
}
message WatchPathsResponse {
  repeated string watch_paths = 1;
  // False until a full crawl has finished once.
  bool crawled = 2;
  // For add and remove: whether anything changed.
  bool changed = 3;
  // For add: the watch paths inside the added one, which it replaced.
  repeated string absorbed = 4;
  // Each watch path's crawl, in watch_paths order.
  repeated RootStatus roots = 5;
}

message RootStatus {
  string path = 1;
  // "pending", "crawling", "ready" or "offline".
  string state = 2;
  // Entries its last or running crawl wrote.
  uint64 entries = 3;
  // Unix seconds its last crawl started and finished here; 0 if none did.
  uint64 started = 4;
  uint64 finished = 5;
}

message SubscribeRequest {
  // "watch_paths", "root", "applied"; all when empty.
  repeated string kinds = 1;
}

message Notice {
  // "watch_paths", "root", "applied", or "lagged": this subscriber fell
  // behind by `count` notices and should refresh.
  string kind = 1;
  // watch_paths: the new watch paths. root: the one root. applied: the
  // folders the changes were in.
  repeated string paths = 2;
  // root: "pending", "crawling", "ready" or "offline".
  string state = 3;
  // root: entries. applied: changes. lagged: notices missed.
  uint64 count = 4;
}

message GetConfigRequest {
  // A dotted key, as in "search.default_limit"; empty for the whole file.
  string key = 1;
}
message ConfigValue {
  // The whole file, or the key's value as TOML.
  string text = 1;
  // For a key: whether the file sets it; otherwise it is the default.
  bool from_file = 2;
}
message ChangeConfigRequest {
  oneof change {
    SetConfig set = 1;
    // Removes the key, so its default applies.
    string unset = 2;
    // Replaces the whole file with this text.
    string replace = 3;
    // Applies the file as it is now, after an edit by hand.
    bool reload = 4;
  }
}
message SetConfig {
  string key = 1;
  // A TOML value; text that is not one is taken as a string.
  string value = 2;
}
message ConfigApplied {
  // Keys that differ from what the daemon started with and that it reads
  // only at startup: they apply when it restarts.
  repeated string restart = 1;
  // Extensions whose section changed and that took the new settings.
  repeated string reloaded = 2;
  // Extensions whose section changed but that did not take it, with why.
  repeated string problems = 3;
}
