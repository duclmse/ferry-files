[package]
name    = "fs-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fsd"
path = "src/main.rs"

# The APIs fsd serves. A build without one ignores its `[api]` switch and says
# so at startup; `grpc` also drops tonic and the bundled protoc from the build.
[features]
default = ["rest", "grpc", "ipc"]
rest    = ["dep:async-stream", "dep:axum", "dep:tower", "dep:tower-http", "dep:hyper"]
grpc    = ["dep:tonic", "dep:tonic-reflection", "dep:prost", "dep:tonic-build", "dep:protoc-bin-vendored"]
ipc     = []

[dependencies]
# Workspace shared
tokio              = { workspace = true }
tokio-util         = { workspace = true }
tokio-stream       = "0.1"
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
toml_edit          = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
bytes              = { workspace = true }
clap               = { workspace = true }
rusqlite           = { workspace = true }
r2d2               = { workspace = true }
r2d2_sqlite        = { workspace = true }
fs-common          = { path = "../fs-common" }
fs-protocol        = { path = "../fs-protocol" }

# Filesystem watching
notify                = "6"
notify-debouncer-full = "0.3"

# Full-text index
tantivy = "0.22"

# gRPC
tonic            = { version = "0.11", optional = true }
tonic-reflection = { version = "0.11", optional = true }
prost            = { version = "0.12", optional = true }

# REST
axum       = { version = "0.8", features = ["macros"], optional = true }
tower      = { version = "0.5", features = ["util"], optional = true }
tower-http = { version = "0.7", features = ["cors", "trace"], optional = true }
hyper      = { version = "1", features = ["full"], optional = true }

# Fuzzy matching
nucleo = "0.5"

# Regex
regex = "1"

# Memory-store path index (HashTable stores entry numbers, not keys)
hashbrown = "0.17"

# Parallel crawl
rayon  = "1"
memchr = "2"
ignore = "0.4"
globset = "0.4"

# Content extraction
encoding_rs = "0.8"
memmap2     = "0.9"
blake3      = { workspace = true }

# Archive inner-file indexing
zip      = { version = "9", default-features = false, features = ["deflate"] }
tempfile = "3"

# Binary serialization (store snapshots)
postcard = { version = "1", features = ["alloc"] }

# Utilities
once_cell = "1"
dashmap   = "6"
flate2    = "1"
# index.bin compression; already built for tantivy's column store.
zstd      = "0.13"

# Streaming ZIP decompression pipeline (Phase 10)
async-trait  = "0.1"
async-stream = { version = "0.3", optional = true }
futures      = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.32", features = ["fs", "process", "resource", "signal", "user"] }

# FSEvents history replay (watcher/journal.rs); already pulled in by `notify`.
[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.5"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[build-dependencies]
tonic-build         = { version = "0.11", optional = true }
protoc-bin-vendored = { version = "3", optional = true }

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"
assert_fs  = "1"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
criterion  = { version = "0.8", features = ["async_tokio"] }

[[bench]]
name    = "search"
harness = false

[[bench]]
name    = "memory_search"
harness = false
required-features = ["rest", "ipc"]

[[test]]
name = "integration"
required-features = ["rest"]

[[bench]]
name    = "archive"
harness = false

[[bench]]
name    = "archive_inflate"
harness = false

[[bench]]
name    = "archive_range"
harness = false

[[bench]]
name    = "scheduler_load"
harness = false

[[bench]]
name    = "reconcile"
harness = false

[[bench]]
name    = "store_scale"
harness = false
