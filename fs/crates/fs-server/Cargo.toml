[package]
name    = "fs-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fsd"
path = "src/main.rs"

[dependencies]
# Workspace shared
tokio              = { workspace = true }
tokio-util         = { workspace = true }
tokio-stream       = "0.1"
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
tracing-appender   = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
bytes              = { workspace = true }
clap               = { workspace = true }
rusqlite           = { workspace = true }
r2d2               = { workspace = true }
r2d2_sqlite        = { workspace = true }
common             = { path = "../common" }
fs-protocol        = { path = "../fs-protocol" }

# Filesystem watching
notify                = "6"
notify-debouncer-full = "0.3"

# Full-text index
tantivy = "0.22"

# gRPC
tonic            = "0.11"
tonic-reflection = "0.11"
prost            = "0.12"

# REST
axum       = { version = "0.7", features = ["macros"] }
tower      = "0.4"
tower-http = { version = "0.5", features = ["cors", "trace"] }
hyper      = { version = "1", features = ["full"] }

# Fuzzy matching
nucleo = "0.5"

# Regex
regex = "1"

# Memory-store path index (HashTable stores entry numbers, not keys)
hashbrown = "0.15"

# Parallel crawl
rayon  = "1"
memchr = "2"
ignore = "0.4"
globset = "0.4"

# Content extraction
encoding_rs = "0.8"
memmap2     = "0.9"
blake3      = { workspace = true }

# Archive inner-file indexing
zip      = { version = "2", default-features = false, features = ["deflate"] }
tempfile = "3"

# Binary serialization (store snapshots)
postcard = { version = "1", features = ["alloc"] }

# Utilities
once_cell = "1"
dashmap   = "5"
flate2    = "1"

# Streaming ZIP decompression pipeline (Phase 10)
async-trait  = "0.1"
async-stream = "0.3"
futures      = "0.3"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.28", features = ["fs", "process", "resource", "user"] }

# FSEvents history replay (watcher/journal.rs); already pulled in by `notify`.
[target.'cfg(target_os = "macos")'.dependencies]
fsevent-sys = "4"

[target.'cfg(target_os = "linux")'.dependencies]
sd-notify = "0.4"

[target.'cfg(windows)'.dependencies]
windows-service = "0.6"
windows = { version = "0.54", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Services",
    "Win32_System_Threading",
] }

[build-dependencies]
tonic-build         = "0.11"
protoc-bin-vendored = "3"

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"
assert_fs  = "1"
reqwest    = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
criterion  = { version = "0.5", features = ["async_tokio"] }

[[bench]]
name    = "search"
harness = false

[[bench]]
name    = "memory_search"
harness = false

[[bench]]
name    = "archive"
harness = false

[[bench]]
name    = "archive_inflate"
harness = false

[[bench]]
name    = "archive_range"
harness = false

[[bench]]
name    = "scheduler_load"
harness = false

[[bench]]
name    = "reconcile"
harness = false
