[package]
name    = "fs-ext-rar2zip"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "fs-ext-rar2zip"
path = "src/main.rs"

[dependencies]
# Workspace shared
tokio              = { workspace = true }
tokio-util         = { workspace = true }
serde              = { workspace = true }
serde_json         = { workspace = true }
toml               = { workspace = true }
tracing            = { workspace = true }
tracing-subscriber = { workspace = true }
clap               = { workspace = true }
thiserror          = { workspace = true }
anyhow             = { workspace = true }
chrono             = { workspace = true }
uuid               = { workspace = true }
glob               = { workspace = true }
bytes              = { workspace = true }
rusqlite           = { workspace = true }
r2d2               = { workspace = true }
r2d2_sqlite        = { workspace = true }
fs-common          = { path = "../fs-common" }
# SFTP transfer (Phase 4) - pure-Rust SSH, no OpenSSL or C libraries required.
# Use ring backend to avoid aws-lc-rs (needs NASM on Windows).
russh      = { version = "0.60", default-features = false, features = ["ring", "flate2", "rsa"] }
russh-sftp = "2"

# Filesystem watching
notify                = "6"
notify-debouncer-full = "0.3"

# Archive formats
unrar       = "0.5"
sevenz-rust = "0.6"
tar         = "0.4"
flate2      = "1"
bzip2       = "0.4"
zip         = { version = "9", default-features = false, features = ["deflate"] }

# Hashing
sha2 = "0.11"
hex  = "0.4"

# HTTP (metrics + dashboard)
tiny_http = "0.12"

# Alerting
ureq   = "2"
lettre = { version = "0.11", features = ["smtp-transport", "tokio1-native-tls", "builder"] }


[features]
integration = []

[dev-dependencies]
tempfile   = "3"
tokio-test = "0.4"
# A real SFTP server for the transfer tests; never linked into the binary.
fs-ext-sftpd = { path = "../fs-ext-sftpd" }
