name: build

on:
  push:
    branches: [main]
    paths:
      - "**"
      # fs.yml builds the fs crates. The app needs fs-protocol and the fsd it bundles
      # (fs-server, with fs-common and fs-protocol), so changes there build it too.
      - "!fs/**"
      - "fs/crates/fs-protocol/**"
      - "fs/crates/fs-server/**"
      - "fs/crates/fs-common/**"
  pull_request:
    paths:
      - "**"
      # fs.yml builds the fs crates. The app needs fs-protocol and the fsd it bundles
      # (fs-server, with fs-common and fs-protocol), so changes there build it too.
      - "!fs/**"
      - "fs/crates/fs-protocol/**"
      - "fs/crates/fs-server/**"
      - "fs/crates/fs-common/**"
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-22.04, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libmtp-dev

      - name: libmtp (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install libmtp
          bash scripts/bundle-libmtp.sh

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Tools
        run: cargo install --locked trunk tauri-cli

      # The PDF preview's renderer: the Linux and Windows bundles list it as a resource, which
      # the build checks for, and the PDFium tests need it.
      - name: PDFium
        shell: bash
        run: bash scripts/fetch-pdfium.sh

      - name: Frontend
        run: cargo build --target wasm32-unknown-unknown

      - name: Unit tests
        working-directory: src-tauri
        run: cargo test --lib

      # The app is built without fsd; its code is still built and tested here.
      - name: With the fsd feature
        working-directory: src-tauri
        run: cargo test --lib --features fsd

      - name: Bundle
        run: cargo tauri build --debug --config '{"build":{"features":[]}}'

      - uses: actions/upload-artifact@v4
        with:
          name: ferry-files-${{ runner.os }}
          path: |
            target/debug/bundle/dmg/*.dmg
            target/debug/bundle/macos/*.app
            target/debug/bundle/deb/*.deb
            target/debug/bundle/rpm/*.rpm
            target/debug/bundle/appimage/*.AppImage
            target/debug/bundle/msi/*.msi
            target/debug/bundle/nsis/*.exe
          if-no-files-found: warn
