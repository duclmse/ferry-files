[package]
name = "ferry-files"
version = "0.1.0"
description = "Browse, read and edit files on an Android phone from computer (adb or MTP)"
edition = "2021"

[lib]
name = "ferry_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.8"
md5 = "0.7"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
zip = { version = "2", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
trash = "5.4.0"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# File lists on the clipboard (the plugin only does text and images).
arboard = { version = "3.7", default-features = false }
regex = { version = "1", default-features = false, features = [
    "std",
    "unicode",
    "perf",
] }

[target.'cfg(unix)'.dependencies]
signal-hook = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }
