[package]
name = "ferry-files"
version = "0.1.0"
description = "Browse, read and edit files on an Android phone from computer (adb or MTP)"
edition = "2021"

[lib]
name = "ferry_files_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
default = []
# Searches of the computer from the index of fsd (the fs project's search daemon), when it runs.
# Off unless asked for: `cargo tauri dev --features fsd`.
fsd = ["dep:postcard", "tokio/net", "tokio/time"]

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9"
md5 = "0.8"
dirs = "7"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
percent-encoding = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }
image = { version = "0.25", default-features = false, features = [
    "jpeg",
    "png",
    "gif",
    "webp",
    "bmp",
] }
trash = "5.4.0"
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
# File lists on the clipboard (the plugin only does text and images).
arboard = { version = "3.7", default-features = false }
regex = { version = "1", default-features = false, features = [
    "std",
    "unicode",
    "perf",
] }
# Colours for code in the preview. Pure-Rust regexes (fancy-regex), so no C library to build.
syntect = { version = "5", default-features = false, features = [
    "parsing",
    "default-syntaxes",
    "regex-fancy",
] }
# HTTP: Everything (plain http), WebDAV and S3 (https too, with rustls and its root certificates).
ureq = { version = "3", default-features = false, features = ["rustls"] }
# S3's request signatures (AWS Signature Version 4).
hmac = "0.13"
sha2 = "0.11"
hex = "0.4"
# Terminals: a real pseudo-terminal (ConPTY on Windows), so programs can ask for input.
portable-pty = "0.9"
base64 = "0.23"
# PDF pages drawn for the preview.
pdfium-render = { version = "0.9.6", default-features = false, features = [
    "pdfium_8125",
    "thread_safe",
] }
# FTP and FTPS (rustls with its root certificates, no OpenSSL).
suppaftp = { version = "13.0.0", default-features = false, features = [
    "rustls-ring",
] }
webpki-roots = "1"
# iPhone and iPad over USB: Apple's usbmuxd and AFC protocols, in pure Rust (async, on tokio).
idevice = { version = "0.1.68", default-features = false, features = [
    "ring",
    "usbmuxd",
    "afc",
    "house_arrest",
    "installation_proxy",
] }
tokio = { version = "1", features = ["rt", "io-util"] }
# fsd's IPC messages (feature `fsd`).
postcard = { version = "1", default-features = false, features = [
    "alloc",
], optional = true }
plist = "1.8"
# Run script…: Lua 5.4, built from source with the app (needs a C compiler).
mlua = { version = "0.12", features = ["lua54", "vendored"] }
# Saved passwords go in the system's keychain: Keychain on macOS, Credential Manager on Windows, and
# the Secret Service over zbus elsewhere, so no C library. keyring 4 names them as 3 did.
keyring = "4"

[target.'cfg(unix)'.dependencies]
signal-hook = "0.4"

[target.'cfg(windows)'.dependencies]
# WebView2's settings (its own shortcuts off; see platform::webview_ready). The version wry uses.
webview2-com = "0.39"
windows = { version = "0.62", features = [
    "Win32_Devices_PortableDevices",
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_Storage_FileSystem",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_IO",
    "Win32_System_Ioctl",
    "Win32_System_Variant",
    "Win32_UI_Shell",
    "Win32_UI_Shell_PropertiesSystem",
] }

[dev-dependencies]
# The PDF tests build their sample PDFs with it.
lopdf = { version = "0.47.0", default-features = false }
