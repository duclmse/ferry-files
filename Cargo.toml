[package]
name = "ferry-files-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = [
    "KeyboardEvent",
    "Selection",
    "Navigator",
    "HtmlTextAreaElement",
    "HtmlInputElement",
    "HtmlIFrameElement",
    "Document",
    "HtmlDocument",
    "Node",
    "NodeList",
    "Element",
    "HtmlElement",
    "XmlSerializer",
    "Event",
    "EventTarget",
    "Storage",
    "MouseEvent",
    "DragEvent",
    "DataTransfer",
    "ScrollIntoViewOptions",
    "ScrollLogicalPosition",
    "DomRect",
    "DomTokenList",
    "HtmlMediaElement",
    "HtmlImageElement",
    "IntersectionObserver",
    "IntersectionObserverEntry",
    "HtmlVideoElement",
    "ResizeObserver",
    "CssStyleDeclaration",
    "ClipboardEvent",
    "WheelEvent",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde-wasm-bindgen = "0.6"
console_error_panic_hook = "0.1"
vt100 = "0.18.1"
base64 = "0.22"

[workspace]
members = ["src-tauri"]

# Image decoding (thumbnails) is far too slow unoptimised; dependencies are built optimised even in dev.
[profile.dev.package."*"]
opt-level = 2

# Smaller, faster release builds: the whole program optimised together.
[profile.release]
lto = true
codegen-units = 1

# The UI is downloaded into the webview at each launch: optimised for size.
[profile.release.package.ferry-files-ui]
opt-level = "s"
